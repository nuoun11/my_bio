                            <input type="text" id="input-tiktok" value="https://www.tiktok.com/@nuoun_e" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-gold-400" oninput="updateProfile()">
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fa-brands fa-discord text-indigo-400 w-5"></i>
                            <input type="text" id="input-discord" value="https://discord.com/users/amin_e" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-gold-400" oninput="updateProfile()">
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fa-brands fa-facebook text-blue-400 w-5"></i>
                            <input type="text" id="input-facebook" value="https://www.facebook.com/MedAminhammami07" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-gold-400" oninput="updateProfile()">
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fa-brands fa-instagram text-pink-400 w-5"></i>
                            <input type="text" id="input-instagram" value="https://www.instagram.com/medaminhm/" class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-gold-400" oninput="updateProfile()">

    <!-- Action Buttons inside Drawer -->
    <div class="pt-6 border-t border-white/10 mt-6 space-y-2">
        <button onclick="copyHTMLConfig()" class="w-full py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white font-medium text-xs flex items-center justify-center gap-2 transition-colors">
            <i class="fa-regular fa-copy"></i>
            <span>Copy Page HTML Code</span>
        </button>
        <button onclick="toggleDrawer(false)" class="w-full py-2.5 rounded-xl bg-gold-500 hover:bg-gold-400 text-black font-bold text-xs uppercase tracking-wider transition-colors">
            Apply &amp; Done
        </button>
    </div>
</aside>

<!-- Toast Notification for Actions -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-black/90 border border-gold-400/50 text-white px-5 py-2.5 rounded-full text-xs font-semibold shadow-2xl flex items-center gap-2 z-50 transition-all duration-300 transform opacity-0 pointer-events-none translate-y-4">
    <i class="fa-solid fa-circle-check text-gold-400"></i>
    <span id="toast-message">HTML code copied to clipboard!</span>
</div>

<!-- JavaScript Logic -->
<script>
    // Automatic Real View Count Incrementing & Storage
    function initViewCounter() {
        let views = parseInt(localStorage.getItem('amin_bio_views')) || 37;
        views += 1;
        localStorage.setItem('amin_bio_views', views);
        
        document.getElementById('card-views').textContent = views;
        document.getElementById('input-views').value = views;
    }

    // Run view counter initialization on page load
    window.addEventListener('DOMContentLoaded', initViewCounter);

    // Toggle Customizer Drawer Open/Close
    function toggleDrawer(open) {
        const drawer = document.getElementById('customizer-drawer');
        const backdrop = document.getElementById('drawer-backdrop');
        
        if (open) {
            backdrop.classList.remove('opacity-0', 'pointer-events-none');
            drawer.classList.remove('translate-x-full');
        } else {
            backdrop.classList.add('opacity-0', 'pointer-events-none');
            drawer.classList.add('translate-x-full');
        }
    }

    // Live Update Profile Elements from Form Input
    function updateProfile() {
        const name = document.getElementById('input-name').value;
        const tagline = document.getElementById('input-tagline').value;
        const status = document.getElementById('input-status').value;
        const quote = document.getElementById('input-quote').value;
        const views = document.getElementById('input-views').value;
        const avatar = document.getElementById('input-avatar').value;
        const bg = document.getElementById('input-bg').value;

        // Update View Count in Storage if manually changed in controls
        if (views !== undefined) {
            localStorage.setItem('hicham_bio_views', views);
        }

        // Update Text & Image elements
        document.getElementById('card-name').textContent = name || 'User';
        document.getElementById('card-tagline').textContent = tagline || '';
        document.getElementById('card-status').textContent = status || 'Online';
        document.getElementById('card-quote').textContent = quote || '';
        document.getElementById('card-views').textContent = views || '0';
        
        if (avatar) {
            document.getElementById('card-avatar').src = avatar;
        }
        if (bg) {
            document.getElementById('wallpaper-container').style.backgroundImage = `url('${bg}')`;
        }

        // Update Links safely
        const tiktokInput = document.getElementById('input-tiktok');
        const tiktokLink = document.getElementById('link-tiktok');
        if (tiktokLink && tiktokInput) tiktokLink.href = tiktokInput.value || '#';
        
        const discordInput = document.getElementById('input-discord');
        const discordLink = document.getElementById('link-discord');
        if (discordLink && discordInput) discordLink.href = discordInput.value || '#';
        
        const facebookInput = document.getElementById('input-facebook');
        const facebookLink = document.getElementById('link-facebook');
        if (facebookLink && facebookInput) facebookLink.href = facebookInput.value || '#';
        
        const instagramInput = document.getElementById('input-instagram');
        const instagramLink = document.getElementById('link-instagram');
        if (instagramLink && instagramInput) instagramLink.href = instagramInput.value || '#';
    }

    // Audio Player Toggle logic
    let isPlaying = false;
    function toggleAudio() {
        const audio = document.getElementById('bg-audio');
        const icon = document.getElementById('audio-icon');
        
        if (isPlaying) {
            audio.pause();
            icon.className = 'fa-solid fa-volume-xmark text-lg';
            showToast('Ambient audio paused');
        } else {
            audio.play().then(() => {
                icon.className = 'fa-solid fa-volume-high text-lg text-gold-400';
                showToast('Playing ambient audio track');
            }).catch(() => {
                showToast('Audio autoplay restricted by browser');
            });
        }
        isPlaying = !isPlaying;
    }

    // Show Toast Notification
    function showToast(msg) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');
        toastMsg.textContent = msg;
        
        toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
        toast.classList.add('opacity-100', 'translate-y-0');

        setTimeout(() => {
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
        }, 3000);
    }

    // Copy HTML configuration to clipboard
    function copyHTMLConfig() {
        const htmlContent = document.documentElement.outerHTML;
        
        // Execute copy action safely
        const dummy = document.createElement('textarea');
        document.body.appendChild(dummy);
        dummy.value = htmlContent;
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);

        showToast('HTML code copied to clipboard!');
    }
</script>

</body></html>
